<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
<title id="title">Pico 2 W — Base Configuration</title>
<desc id="desc">Underside view, USB at top. GP2 pin 4 to RF center, pin 3 ground to shield. GP14 pin 19 to normally open switch, returning to pin 18 ground. GP15 pin 20 to the positive lead of an LED assembly with a built-in resistor; its negative lead returns to pin 18 ground. No separate series resistor is required.</desc>
