<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
<title id="title">Pico 2 W — Si5351 wiring</title>
<desc id="desc">Underside view. VBUS pin 40 to Si5351 pin 10, ground pin 38 to module pin 1. SDA to GP4 pin 6, SCL to GP5 pin 7, CLK2 to GP7 pin 10.</desc>
