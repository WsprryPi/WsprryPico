name: USB installer

on:
  push:
    branches: [devel, main]
    paths:
      - scripts/install_usb.sh
      - scripts/usb_installer.py
      - scripts/ci/release-manifest-1.schema.json
      - scripts/ci/installer_release.py
      - scripts/ci/publish.py
      - tests/usb_installer_tests.py
      - tests/installer_release_tests.py
      - tests/fixtures/usb-installer/**
      - .github/workflows/usb-installer.yml
  pull_request:
    branches: [devel, main]
    paths:
      - scripts/install_usb.sh
      - scripts/usb_installer.py
      - scripts/ci/release-manifest-1.schema.json
      - scripts/ci/installer_release.py
      - scripts/ci/publish.py
      - tests/usb_installer_tests.py
      - tests/installer_release_tests.py
      - tests/fixtures/usb-installer/**
      - .github/workflows/usb-installer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.11'
      - run: python tests/usb_installer_tests.py
      - run: python tests/installer_release_tests.py
  publish:
    needs: verify
    if: github.repository == 'WsprryPi/WsprryPico' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: usb-installer-publication-${{ github.ref }}
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.11'
      - name: Publish verified installer and advance compatible channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/installer_release.py
