name: Software and firmware

on:
  push:
    branches: [devel, main]
    tags: ['v*']
  pull_request:
    branches: [devel, main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified assets (explicit authorization; default is checks only)
        type: boolean
        default: false
      make_latest:
        description: Mark a final release as latest stable (requires publish)
        type: boolean
        default: false
      profile:
        description: Firmware profiles
        type: choice
        options: [consumer]
        default: consumer

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI_PROFILE: ${{ inputs.profile || 'consumer' }}
      CI_PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
      CI_MAKE_LATEST: ${{ inputs.make_latest && 'true' || 'false' }}
      CI_STREAM: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.event_name == 'pull_request' && 'pull-request' || github.ref_name }}
      CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
      CI_EVENT_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.8.0'
          package-manager-cache: false
      - name: Validate bounded inputs
        run: python scripts/ci/run.py inputs
      - name: Install hash-pinned host tools and test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/ci/requirements.txt
      - name: Obtain exact verified compiler, SDK and test sources
        run: python scripts/ci/setup.py "$RUNNER_TEMP/wsprrypico-inputs"
      - name: Check software and build verified firmware bundles
        run: python scripts/ci/run.py build --dependencies "$RUNNER_TEMP/wsprrypico-inputs" --output "$RUNNER_TEMP/wsprrypico-output"
      - name: Upload linked-image audit materials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WsprryPico-audit-${{ env.CI_STREAM }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_PROFILE }}
          path: ${{ runner.temp }}/wsprrypico-output/audit/
          if-no-files-found: error
          retention-days: 90
      - name: Upload complete firmware bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WsprryPico-firmware-${{ env.CI_STREAM }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_PROFILE }}
          path: ${{ runner.temp }}/wsprrypico-output/deployment/*
          if-no-files-found: error
          retention-days: 90
      - name: Retain failure logs without deployment assets
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WsprryPico-failure-logs-${{ env.CI_STREAM }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wsprrypico-output/audit/*.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: verify
    if: github.repository == 'WsprryPi/WsprryPico' && github.event_name == 'workflow_dispatch' && inputs.publish && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: firmware-publication-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    env:
      CI_PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
      CI_MAKE_LATEST: ${{ inputs.make_latest && 'true' || 'false' }}
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.11'
      - name: Install hash-pinned validation dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/ci/requirements.txt
      - name: Preserve exact verified bytes and update this branch download index
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/publish.py --destination "$RUNNER_TEMP/wsprrypico-publication"
