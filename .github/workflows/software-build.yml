name: Software and firmware

on:
  push:
    branches: [devel]
    paths-ignore:
      - 'docs/development/software-build-ci-results.md'
      - 'docs/development/consolidated-backlog.md'
      - 'docs/development/software-build-ci-execution-prompt.md'
  pull_request:
    branches: [devel, main]
  workflow_dispatch:
    inputs:
      profile:
        description: Firmware profiles
        type: choice
        options: [consumer]
        default: consumer

permissions:
  contents: read

concurrency:
  group: software-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI_PROFILE: ${{ inputs.profile || 'consumer' }}
      CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
      CI_EVENT_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.8.0'
      - name: Validate bounded inputs
        run: python scripts/ci/run.py inputs
      - name: Install hash-pinned host tools and test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/ci/requirements.txt
      - name: Obtain exact verified SDK, compiler and companion sources
        run: python scripts/ci/setup.py "$RUNNER_TEMP/wsprrypico-inputs"
      - name: Check software and build verified firmware bundles
        run: python scripts/ci/run.py build --dependencies "$RUNNER_TEMP/wsprrypico-inputs" --output "$RUNNER_TEMP/wsprrypico-output"
      - name: Upload linked-image audit materials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WsprryPico-audit-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_PROFILE }}
          path: ${{ runner.temp }}/wsprrypico-output/audit/
          if-no-files-found: error
          retention-days: 90
      - name: Upload complete firmware bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WsprryPico-firmware-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_PROFILE }}
          path: ${{ runner.temp }}/wsprrypico-output/deployment/*
          if-no-files-found: error
          retention-days: 90
      - name: Retain failure logs without deployment assets
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WsprryPico-failure-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wsprrypico-output/audit/*.log
          if-no-files-found: ignore
          retention-days: 14
