name: Publish prepared firmware
run-name: Prepared firmware ${{ inputs.packet_sha256 }} (${{ inputs.publish && 'publish' || 'validate' }})

on:
  workflow_dispatch:
    inputs:
      prepared_plan:
        description: Exact retained prepared-publication.json (public provenance only)
        type: string
        required: true
      packet_sha256:
        description: Confirm the prepared packet SHA256
        type: string
        required: true
      publisher_source:
        description: Exact expected publisher checkout commit
        type: string
        required: true
      publish:
        description: Publish unchanged prepared bytes (false validates only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'WsprryPi/WsprryPico' && !inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    concurrency:
      group: prepared-firmware-publication
      cancel-in-progress: false
      queue: max
    env:
      CI_PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
      CI_PREPARED_PLAN: ${{ inputs.prepared_plan }}
      CI_PREPARED_PACKET_SHA256: ${{ inputs.packet_sha256 }}
      CI_EXPECTED_PUBLISHER_SOURCE: ${{ inputs.publisher_source }}
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.11'
      - name: Install hash-pinned validation dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/ci/requirements.txt
      - name: Check the retained-release and public consumer contracts
        run: |
          python tests/ci_bundle_tests.py
          python tests/usb_installer_tests.py
      - name: Verify the retained canonical packet and selected publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/prepared.py workflow --destination "$RUNNER_TEMP/prepared-publication"
  publish:
    if: github.repository == 'WsprryPi/WsprryPico' && inputs.publish && github.ref == 'refs/heads/devel'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    concurrency:
      group: prepared-firmware-publication
      cancel-in-progress: false
      queue: max
    env:
      CI_PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
      CI_PREPARED_PLAN: ${{ inputs.prepared_plan }}
      CI_PREPARED_PACKET_SHA256: ${{ inputs.packet_sha256 }}
      CI_EXPECTED_PUBLISHER_SOURCE: ${{ inputs.publisher_source }}
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.11'
      - name: Install hash-pinned validation dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/ci/requirements.txt
      - name: Verify the retained canonical packet and selected publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/prepared.py workflow --destination "$RUNNER_TEMP/prepared-publication"
